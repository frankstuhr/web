<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<meta name="description" content="Hello World — mit wechselnden Bergpanoramen.">
<link rel="preconnect" href="https://images.unsplash.com">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0d1117;
    color: #fff;
    overflow: hidden;
  }

  /* --- Hintergrund-Ebenen (zwei, die sich gegenseitig überblenden) --- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #0d1117;
  }

  .layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2s ease-in-out;
    will-change: opacity, transform;
  }

  .layer.is-active {
    opacity: 1;
  }

  /* Langsamer Ken-Burns-Zoom, neu gestartet bei jedem Bildwechsel */
  .layer.is-animating {
    animation: kenburns 14s ease-out forwards;
  }

  @keyframes kenburns {
    from { transform: scale(1.02); }
    to   { transform: scale(1.12); }
  }

  /* Abdunkelung für Lesbarkeit der Schrift */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,.15) 0%, rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.5) 100%);
    pointer-events: none;
  }

  /* --- Inhalt --- */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.75rem, 11vw, 7rem);
    font-weight: 200;
    letter-spacing: .06em;
    line-height: 1.05;
    text-shadow: 0 2px 40px rgba(0,0,0,.6);
    animation: rise 1.4s cubic-bezier(.2,.7,.3,1) both;
  }

  .tagline {
    margin: 1.25rem 0 0;
    font-size: clamp(.9rem, 2.2vw, 1.15rem);
    font-weight: 300;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(255,255,255,.82);
    text-shadow: 0 1px 20px rgba(0,0,0,.7);
    animation: rise 1.4s .25s cubic-bezier(.2,.7,.3,1) both;
  }

  .rule {
    width: 72px;
    height: 1px;
    margin: 2rem 0 0;
    background: rgba(255,255,255,.45);
    animation: rise 1.4s .45s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* --- Punkte zum Umschalten --- */
  .dots {
    position: fixed;
    z-index: 3;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: .6rem;
  }

  .dot {
    width: 8px;
    height: 8px;
    padding: 0;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    transition: background .4s ease, transform .3s ease;
  }

  .dot:hover { transform: scale(1.35); }
  .dot[aria-current="true"] { background: #fff; }
  .dot:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* --- Bildnachweis --- */
  .credit {
    position: fixed;
    z-index: 3;
    right: 1.25rem;
    bottom: 1.25rem;
    font-size: .75rem;
    letter-spacing: .04em;
    color: rgba(255,255,255,.65);
    text-shadow: 0 1px 8px rgba(0,0,0,.8);
    transition: opacity .6s ease;
  }

  .credit a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.3);
  }

  .credit a:hover { color: #fff; }

  @media (max-width: 600px) {
    .credit { left: 1.25rem; right: 1.25rem; text-align: center; bottom: 4.25rem; }
  }

  /* Bewegung reduzieren, wenn vom System gewünscht */
  @media (prefers-reduced-motion: reduce) {
    .layer, h1, .tagline, .rule { animation: none !important; transition: opacity .4s linear; }
  }
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="layer" id="layerA"></div>
  <div class="layer" id="layerB"></div>
</div>
<div class="scrim" aria-hidden="true"></div>

<main class="content">
  <h1>Hello World</h1>
  <p class="tagline">Irgendwo in den Bergen</p>
  <div class="rule" aria-hidden="true"></div>
</main>

<nav class="dots" id="dots" aria-label="Hintergrundbild wählen"></nav>

<p class="credit" id="credit"></p>

<script>
(function () {
  "use strict";

  var PHOTOS = [
    { id: "1464822759023-fed622ff2c3b", by: "Kalen Emsley" },
    { id: "1483728642387-6c3bdd6c93e5", by: "Daniel Leone" },
    { id: "1519681393784-d120267933ba", by: "Benjamin Voros" },
    { id: "1570641963303-92ce4845ed4c", by: "Massimiliano Morosinotto" },
    { id: "1501785888041-af3ef285b470", by: "Pietro De Grandi" },
    { id: "1478059299873-f047d8c5fe1a", by: "Mark Basarab" },
    { id: "1465056836041-7f43ac27dcb5", by: "Tobias Keller" },
    { id: "1506905925346-21bda4d32df4", by: "Sam Ferrara" }
  ];

  var INTERVAL = 7000;

  function urlFor(photo) {
    var w = Math.min(2400, Math.ceil((window.innerWidth || 1600) * (window.devicePixelRatio || 1)));
    return "https://images.unsplash.com/photo-" + photo.id +
           "?auto=format&fit=crop&w=" + w + "&q=80";
  }

  var layers = [document.getElementById("layerA"), document.getElementById("layerB")];
  var creditEl = document.getElementById("credit");
  var dotsEl = document.getElementById("dots");
  var front = 0;      // Index der aktuell sichtbaren Ebene
  var current = -1;   // Index des aktuellen Fotos
  var timer = null;

  // Punkte aufbauen
  var dots = PHOTOS.map(function (photo, i) {
    var b = document.createElement("button");
    b.className = "dot";
    b.type = "button";
    b.setAttribute("aria-label", "Bild " + (i + 1) + " von " + PHOTOS.length);
    b.addEventListener("click", function () { show(i); restart(); });
    dotsEl.appendChild(b);
    return b;
  });

  function show(index) {
    if (index === current) return;
    current = index;

    var photo = PHOTOS[index];
    var next = layers[1 - front];
    var prev = layers[front];

    next.style.backgroundImage = 'url("' + urlFor(photo) + '")';

    // Ken-Burns-Animation für die neue Ebene neu starten
    next.classList.remove("is-animating");
    void next.offsetWidth; // Reflow erzwingen
    next.classList.add("is-animating", "is-active");
    prev.classList.remove("is-active");

    front = 1 - front;

    creditEl.innerHTML = 'Foto: ' + photo.by +
      ' · <a href="https://unsplash.com" target="_blank" rel="noopener noreferrer">Unsplash</a>';

    dots.forEach(function (d, i) {
      d.setAttribute("aria-current", i === index ? "true" : "false");
    });
  }

  function next() {
    show((current + 1) % PHOTOS.length);
  }

  function restart() {
    clearInterval(timer);
    timer = setInterval(next, INTERVAL);
  }

  // Alle Bilder im Hintergrund vorladen, damit die Wechsel sauber sind
  PHOTOS.forEach(function (photo) {
    var img = new Image();
    img.src = urlFor(photo);
  });

  // Bei verstecktem Tab pausieren – spart Daten und Akku
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { clearInterval(timer); } else { restart(); }
  });

  show(0);
  restart();
})();
</script>

</body>
</html>
